[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pythagoras"
version = "0.1.0"
description = "Shiny-for-Python app with card-based analytics"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nick Ward" }]
dependencies = [
  "faicons>=0.2",
  "geopandas>=1.0",
  "jsonschema>=4.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "plotly>=5.18",
  "pyarrow>=14",
  "requests>=2.0",
  "session-info>=1.0",
  "shapely>=2.0",
  "shiny>=1.0",
  "shinywidgets>=0.3.1",
  "xarray",
  "scipy>=1.10",
  "mlxtend>=0.23",
  "scikit-learn>=1.4",
  "shinylive==0.8.11",
  "cards>=2.0.0",
  "card>=0.0.1",
  "roles>=1.0.0",
  "seaborn==0.13.2",
  "statsmodels==0.15.0",
  "vega-datasets==0.9.0",
  "ucimlrepo==0.0.7",
  "pytest-playwright==0.9.0",
  "jinja2==3.1.6",
  "pytest-asyncio==1.4.0",
  "pytest==9.1.1",
  "playwright==1.62.0",
  "polars==1.44.1",
]

[tool.hatch.build]
include = [
  "app/**",
]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
]
